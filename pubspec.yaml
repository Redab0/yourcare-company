name: cleaning_service_driver
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # State management
  flutter_bloc: ^8.1.4
  equatable: ^2.0.5
  
  # Navigation
  go_router: ^13.2.0
  
  # Local storage
  shared_preferences: ^2.2.2

  retrofit: ^4.4.2
  json_annotation: ^4.9.0
  
  # Utility
  intl: ^0.20.2
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  
  # Dependency injection
  get_it: ^7.6.7
  
  # Http client
  dio: ^5.4.1
  dio_cache_interceptor: ^3.5.0
  pretty_dio_logger: ^1.3.1
  http: ^1.2.0
  
  # Security
  flutter_secure_storage: ^9.0.0
  flutter_security_checker: ^3.2.1
  device_info_plus: ^9.1.1
  uuid: ^4.3.3
  crypto: ^3.0.3
  package_info_plus: ^8.3.0
  
  # Functional programming
  dartz: ^0.10.1

  http_parser: ^4.1.2
  image_picker: ^1.1.2

  collection: ^1.19.1
  google_maps_flutter: ^2.5.3
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  google_fonts: ^6.2.1
  lottie: ^3.3.1
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.3.2
  fl_chart: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.8
  retrofit_generator: ^9.2.0
  json_serializable: ^6.8.0


flutter:
  generate: true
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/animations/empty_list.json
    - assets/animations/empty_ghost.json
    - assets/animations/cleaning_lady.json
    - assets/animations/scrub_brush.json
    - assets/animations/house_cleaning.json
    - assets/animations/blue_loading.json
    - assets/animations/loading_plane.json


  fonts:
    - family: Zain
      fonts:
        - asset: assets/fonts/Zain-Regular.ttf
        - asset: assets/fonts/Zain-Bold.ttf
          weight: 700
        - asset: assets/fonts/Zain-Black.ttf
          weight: 900
        - asset: assets/fonts/Zain-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Zain-Light.ttf
          weight: 300
        - asset: assets/fonts/Zain-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Zain-Italic.ttf
          style: italic
        - asset: assets/fonts/Zain-LightItalic.ttf
          weight: 300
          style: italic
