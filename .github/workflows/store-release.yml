name: Upload store builds

on:
  push:
    tags: ['store-*']
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to upload (select one to retry a partial release)
        type: choice
        options: [both, android, ios]
        default: both
      bump:
        description: Increment the latest store marketing version
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

# All refs share this lock: fetching a version and uploading must be serialized.
# GitHub keeps one running and one pending run per group; newer pending runs replace older ones.
concurrency:
  group: store-release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.35.4'
  APP_IDENTIFIER: com.yourcarehere.partner
  FASTLANE_SKIP_UPDATE_CHECK: 'true'
  FASTLANE_HIDE_CHANGELOG: 'true'
  FASTLANE_OPT_OUT_USAGE: 'true'
  GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.workers.max=2'

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  upload:
    needs: checks
    environment: store-release
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'android' && '["android"]' || inputs.platform == 'ios' && '["ios"]' || '["android", "ios"]') }}
    runs-on: ${{ matrix.platform == 'ios' && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode
        if: matrix.platform == 'ios'
        env:
          XCODE_VERSION: ${{ vars.XCODE_VERSION || '26.2' }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Install locked app dependencies
        run: flutter pub get --enforce-lockfile
      - name: Prepare Android signing and service configuration
        if: matrix.platform == 'android'
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/ci/prepare_release.py android
      - name: Prepare Apple signing and service configuration
        if: matrix.platform == 'ios'
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_IOS_API_KEY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || '796XPXGJ9F' }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
        run: python3 scripts/ci/prepare_release.py ios
      - name: Fetch Play version, build and upload to internal testing
        if: matrix.platform == 'android'
        env:
          VERSION_BUMP: ${{ inputs.bump || 'patch' }}
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
        run: bundle exec fastlane android internal "bump:$VERSION_BUMP"
      - name: Fetch Apple version, build and upload to TestFlight
        if: matrix.platform == 'ios'
        env:
          VERSION_BUMP: ${{ inputs.bump || 'patch' }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: bundle exec fastlane ios beta "bump:$VERSION_BUMP"
      - name: Save build and version evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/ci/*-version.json
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/mapping/release/mapping.txt
            build/ios/ipa/*.ipa
            build/ios/archive/Runner.xcarchive/dSYMs
      - name: Remove temporary signing material
        if: always()
        run: python3 scripts/ci/prepare_release.py cleanup
