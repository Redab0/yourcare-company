name: Checks

on:
  pull_request:
  push:
    branches: [develop, main, master]
  workflow_call:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.35.4'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Test store version policy
        run: bundle exec ruby fastlane/test/store_version_test.rb
      - name: Test signing input validation
        run: python3 -m unittest discover -s scripts/ci -p '*_test.py'
      - name: Install locked app dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        run: flutter test
